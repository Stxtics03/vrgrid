name: ci

# main is always green. If CI is red, fixing it outranks whatever you were
# doing. Never merge a red branch "to fix later".
# Runs on every branch, not just main: a dev branch that only gets checked at
# PR time is a branch that discovers a red test hours after it was written.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"

      - name: unit tests
        run: pytest -q

      # The three that catch what is expensive to find late.
      - name: partition test (CI-blocking)
        run: pytest -q -m partition

      - name: determinism test (CI-blocking)
        run: pytest -q -m determinism

      - name: lint
        run: ruff check .
