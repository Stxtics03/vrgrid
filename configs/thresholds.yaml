# FROZEN before any schedule comparison. Master v4 §3.8, flaw E6.
#
# If these move between runs you are comparing tuning effort, not schedules.
# Tune on sequence 07, report on 08 -- never tune and report on the same one.
#
# Every value here is read at startup. Nothing in src/ may hardcode a threshold
# inline; if you find one, that is a bug, not a shortcut.

frozen: true
frozen_on: null        # set to the commit sha at the Day-0 freeze
tuning_sequence: "07"
reporting_sequence: "08"

# --- traversability bitfield (math §7.1), 0 = traversable -------------------
traversability:
  h_vehicle_m: 1.8         # bit 0  clearance
  theta_max_deg: 20.0      # bit 1  slope, compared as tan(theta_max)
  s_max_m: 0.15            # bit 2  step, max |z_c - z_nbr| over 4-neighbours
  baseline_m: 0.50         # bits 1 and 2 are differenced over THIS distance,
                           # not over one cell. Without it the same 12 cm kerb
                           # is a gradient of 1.200 at 5 cm and 0.240 at 25 cm
                           # against one frozen theta_max, so a feature is a
                           # wall on the fine rings and flat ground on the
                           # coarse ones and on M* -- the eq. (23) asymmetry.
                           # Bounded by the scene, not by taste: it must be
                           # > 0.12/tan(20 deg) = 0.33 m for the 12 cm kerb to
                           # read passable at EVERY cell size, and
                           # < 0.40/tan(20 deg) = 1.10 m for the 40 cm pothole
                           # rim to still fail. 0.50 m is the middle of that
                           # window. A ring coarser than baseline_m/2 falls
                           # back to one cell, so this is a no-op at 40 cm and
                           # 80 cm and at the 25 cm planning lattice.
  sigma2_max_m2: 0.0025    # bit 3  roughness, (5 cm)^2
  n_min: 3                 # bit 5  confidence -- below this, fail safe
  drivable_classes: [road, parking, sidewalk, other-ground, terrain]  # bit 4

# --- occupancy ---------------------------------------------------------------
occupancy:
  # Unknown is decided by observation count, NOT by log-odds near zero.
  unknown_below_obs: 1
  log_odds_hit: 4
  log_odds_miss: -2
  log_odds_clamp: [-64, 63]
  log_odds_occupied: 0     # l_occ of §10.1. The section names it in the state
                           # rule and never gives it a value; this file never
                           # had one either, so occupancy_state() had nothing
                           # to compare against. 0 = "more hits than misses",
                           # the neutral reading. Frozen with the rest.

# --- fusion (math §3.3) ------------------------------------------------------
fusion:
  process_noise_m2_per_s: 1.0e-4   # q. Without it sigma^2 collapses toward
                                   # zero, K goes to 0 and the cell stops
                                   # responding to new evidence -- the classic
                                   # filter-lock failure. §3.3.
  frame_dt_s: 0.1                  # 10 Hz

# --- split / merge variance model (math §5.2 eq. 17) ------------------------
# sigma2_child = sigma2_parent + kappa ||grad z||^2 (c_p^2 - c_c^2) + alpha
split_merge:
  kappa: 0.0625            # 1/16, §5.2 as written.
                           # ⚑ §5.2 derives this from "d^2 = c_p^2/16", but
                           # (17) multiplies it by (c_p^2 - c_c^2), not c_p^2.
                           # The stated geometry actually gives 1/12, at every
                           # refinement ratio m. 1/16 under-inflates by 25%.
                           # Kept as documented; the room decides, not me.
                           # Pinned in tests/test_splitmerge.py.
  alpha_m2: 0.0            # sub-cell roughness. UNCALIBRATED: §5.2 calibrates
                           # it against the reference map (§9), which is
                           # blocked on the download. 0 is also the only value
                           # consistent with §5.3's "splitting flat ground
                           # costs nothing" and §5.4's unit test (c) -- raising
                           # alpha means restating both, in the same commit.

# --- sensor (HDL-64E on KITTI) ----------------------------------------------
sensor:
  height_m: 1.73
  phi_min_deg: -24.8
  blind_cone_m: 3.74       # h / tan|phi_min|. Unknown, never free. 11% of Ring 0.
  # Range-image geometry (num_rings/num_azimuth/phi_max and the derived bin
  # widths) lives in configs/frnet.yaml, which is what range_image.py reads.
  # The old d_theta_deg / d_phi_deg keys here were never read by anything.
  # Measurement-noise model, math §3.2 eq (12). sigma_phi is stated in the
  # math doc; sigma_r is NOT -- 2 cm is the HDL-64E datasheet figure and an
  # assumption of ours. It only moves the near-field floor: the 8.7 cm at 50 m
  # and 17.5 cm at 100 m figures are dominated by the sigma_phi term.
  sigma_r_m: 0.02
  sigma_phi_deg: 0.1

# --- scatter (math §3.4) -----------------------------------------------------
scatter:
  # "sorted" reduces segments of a sorted index array: scratch is sized by
  # POINTS (~1.8 MB) and needs no per-frame clear. "atomic" is the literal
  # integer-atomics path: a dense per-cell accumulator, ~11.9 MB at 745,000
  # cells, cleared every frame. Both are bit-identical; this is a cost choice.
  mode: sorted
  max_points_per_frame: 150000
  weight_scale: 1024

# --- plan regret (math §8) ---------------------------------------------------
# w of eq. (23)'s cost functional, J = sum over path cells of w(c)*dl.
# §8.1 says "w derived from the traversability bitfield" and stops there, so
# the derivation lives in src/eval/plan_regret.py and the numbers live here.
plan:
  cell_m: 0.25             # the PLANNER's resolution, not the map's. A vehicle
                           # plans in vehicle-sized steps; the map is finer
                           # than this wherever it matters, which is the point.
  w_base: 1.0
  w_roughness: 2.0         # drivable and undesirable -- a weight, not a wall
  w_class: 3.0             # ditto: geometry decides, semantics filters (§7.1)
  w_unknown: 4.0           # ⚑ unknown is PASSABLE here, unlike everywhere else
                           # in this project. At P_fill < 2% per frame (§1.3)
                           # most of the far field is unobserved, so with
                           # unknown impassable no path exists and R(S) is
                           # undefined for every schedule. Read the regret
                           # together with PlanResult.unknown_fraction: zero
                           # regret along a mostly-unknown path means the
                           # sequence was too short, not that coarsening was free.
  corridor_tau: 5.0        # tau of eq. (25), in cost units. Sets the refinement
                           # budget and maps onto the pool size.

# --- visibility cleanup (math §10.4) ----------------------------------------
visibility:
  # Never clear a cell that has a return in the current scan. Without this
  # guard the cleanup eats fences, poles and sign posts within a few frames.
  protect_current_returns: true
  range_tolerance_m: 0.30
  frames_to_clear: 3
  # Cap on candidate cells per frame -- the currently-OCCUPIED cells, since a
  # free cell has nothing to clear. It sizes the cleanup's preallocated
  # scratch at 64 B per cell against a float32 range image, exactly the way
  # `scatter.max_points_per_frame` sizes the scatter scratch.
  #
  # ⚑ PROVISIONAL. 150,000 is an argument, not a measurement: a sweep touches
  #   ~105,000 distinct cells a frame and the occupied set of a rolling 100 m
  #   local map should not be several times that. The measurement needs
  #   SemanticKITTI on disk. Raising it costs 64 B a cell and moves the
  #   dashboard's total; lowering it silently drops candidates from the far
  #   field, which is where over-clearing is least likely to be noticed.
  max_candidate_cells: 150000

# --- refinement pool (master v4 §3.4) ---------------------------------------
refinement_pool:
  blocks: 512
  cells_per_block: 16      # 512 * 16 * 12 B = 98 KB, fixed
  evict_by: [closeness, dynamism, time_to_collision]
