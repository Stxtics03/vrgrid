# FROZEN before any schedule comparison. Master v4 §3.8, flaw E6.
#
# If these move between runs you are comparing tuning effort, not schedules.
# Tune on sequence 07, report on 08 -- never tune and report on the same one.
#
# Every value here is read at startup. Nothing in src/ may hardcode a threshold
# inline; if you find one, that is a bug, not a shortcut.

frozen: true
frozen_on: null        # set to the commit sha at the Day-0 freeze
tuning_sequence: "07"
reporting_sequence: "08"

# --- traversability bitfield (math §7.1), 0 = traversable -------------------
traversability:
  h_vehicle_m: 1.8         # bit 0  clearance
  theta_max_deg: 20.0      # bit 1  slope, compared as tan(theta_max)
  s_max_m: 0.15            # bit 2  step, max |z_c - z_nbr| over 4-neighbours
  sigma2_max_m2: 0.0025    # bit 3  roughness, (5 cm)^2
  n_min: 3                 # bit 5  confidence -- below this, fail safe
  drivable_classes: [road, parking, sidewalk, other-ground, terrain]  # bit 4

# --- occupancy ---------------------------------------------------------------
occupancy:
  # Unknown is decided by observation count, NOT by log-odds near zero.
  unknown_below_obs: 1
  log_odds_hit: 4
  log_odds_miss: -2
  log_odds_clamp: [-64, 63]

# --- split / merge variance model (math §5.2 eq. 17) ------------------------
# sigma2_child = sigma2_parent + kappa ||grad z||^2 (c_p^2 - c_c^2) + alpha
split_merge:
  kappa: 0.0625            # 1/16, §5.2 as written.
                           # ⚑ §5.2 derives this from "d^2 = c_p^2/16", but
                           # (17) multiplies it by (c_p^2 - c_c^2), not c_p^2.
                           # The stated geometry actually gives 1/12, at every
                           # refinement ratio m. 1/16 under-inflates by 25%.
                           # Kept as documented; the room decides, not me.
                           # Pinned in tests/test_splitmerge.py.
  alpha_m2: 0.0            # sub-cell roughness. UNCALIBRATED: §5.2 calibrates
                           # it against the reference map (§9), which is
                           # blocked on the download. 0 is also the only value
                           # consistent with §5.3's "splitting flat ground
                           # costs nothing" and §5.4's unit test (c) -- raising
                           # alpha means restating both, in the same commit.

# --- sensor (HDL-64E on KITTI) ----------------------------------------------
sensor:
  height_m: 1.73
  d_theta_deg: 0.2
  d_phi_deg: 0.427
  phi_min_deg: -24.8
  blind_cone_m: 3.74       # h / tan|phi_min|. Unknown, never free. 11% of Ring 0.
  # Measurement-noise model, math §3.2 eq (12). sigma_phi is stated in the
  # math doc; sigma_r is NOT -- 2 cm is the HDL-64E datasheet figure and an
  # assumption of ours. It only moves the near-field floor: the 8.7 cm at 50 m
  # and 17.5 cm at 100 m figures are dominated by the sigma_phi term.
  sigma_r_m: 0.02
  sigma_phi_deg: 0.1

# --- scatter (math §3.4) -----------------------------------------------------
scatter:
  # "sorted" reduces segments of a sorted index array: scratch is sized by
  # POINTS (~1.8 MB) and needs no per-frame clear. "atomic" is the literal
  # integer-atomics path: a dense per-cell accumulator, ~11.9 MB at 745,000
  # cells, cleared every frame. Both are bit-identical; this is a cost choice.
  mode: sorted
  max_points_per_frame: 150000
  weight_scale: 1024

# --- visibility cleanup (math §10.4) ----------------------------------------
visibility:
  # Never clear a cell that has a return in the current scan. Without this
  # guard the cleanup eats fences, poles and sign posts within a few frames.
  protect_current_returns: true
  range_tolerance_m: 0.30
  frames_to_clear: 3

# --- refinement pool (master v4 §3.4) ---------------------------------------
refinement_pool:
  blocks: 512
  cells_per_block: 16      # 512 * 16 * 12 B = 98 KB, fixed
  evict_by: [closeness, dynamism, time_to_collision]
