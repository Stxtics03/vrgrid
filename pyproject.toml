[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrgrid"
version = "0.0.0"
description = "Adaptive variable-resolution 2.5D LiDAR mapping (SIH26053)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
dash = ["rerun-sdk>=0.16"]
# Patchwork++ ground segmentation. A C++ extension -- install locally with
# `pip install -e ".[perception]"`. PyPI has prebuilt wheels for CPython
# 3.8-3.13 on: win_amd64, win32, manylinux/musllinux x86_64 + i686, and
# macOS arm64. On a platform with NO wheel -- notably Linux aarch64 and Intel
# macOS -- pip falls back to the sdist, whose CMake fetches an empty version
# tag and 404s; build from a git checkout instead:
#     git clone --depth 1 https://github.com/url-kaist/patchwork-plusplus.git
#     pip install ./patchwork-plusplus/python
# ground.py falls back to a semantic-class proxy when it is absent (and warns
# loudly -- see segment_ground_or_fallback), so CI (which does not install it)
# still runs the ground tests; the Patchwork++-specific tests skip.
perception = ["pypatchworkpp>=1.2"]
dev = ["pytest>=7.4", "ruff>=0.4"]
# Figures only. Deliberately NOT in `dev`: CI does not draw, and a plotting
# stack in the test image buys nothing. `regret_plot.py` writes its CSV
# either way and says so when the figure is skipped.
report = ["matplotlib>=3.7"]

# The repo is laid out by OWNER (src/grid = Aakash, src/gpu = Shrestha, ...) so
# that two people rarely touch the same file. These mappings make that layout
# importable as one `vrgrid` package, so the documented commands work:
#   python -m vrgrid.run    python -m vrgrid.dash
[tool.setuptools]
packages = [
    "vrgrid",
    "vrgrid.grid",
    "vrgrid.eval",
    "vrgrid.gpu",
    "vrgrid.perception",
    "vrgrid.run",
    "vrgrid.dash",
    "vrgrid.adapters",
]

[tool.setuptools.package-dir]
"vrgrid" = "include/vrgrid"          # FROZEN shared surface
"vrgrid.grid" = "src/grid"
"vrgrid.eval" = "src/eval"
"vrgrid.gpu" = "src/gpu"
"vrgrid.perception" = "src/perception"
"vrgrid.run" = "src/run"
"vrgrid.dash" = "dashboard"
"vrgrid.adapters" = "adapters"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "determinism: same input twice -> identical map hash (CI-blocking)",
    "partition: exactly one cell per ring per point (CI-blocking)",
    "theorem: proves a result from docs/sih-math.md -- never weaken to pass",
]

[tool.ruff]
line-length = 100
# src/perception/frnet is a NON-FUNCTIONAL port, deliberately frozen as a reference
# for a possible mmdet3d swap (master-v4 3.6). Not ours to modernise -- excluded so
# lint reflects code we actually build on.
extend-exclude = ["src/perception/frnet"]
